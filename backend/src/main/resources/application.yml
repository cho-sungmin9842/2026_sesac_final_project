server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    # 명시적으로 다른 프로필을 지정하지 않으면 local 프로필을 기본으로 사용합니다.
    # application-local.yml에 KMDB 키를 적어두면 매번 환경변수를 설정할 필요가 없습니다.
    default: local

kmdb:
  base-url: https://api.koreafilm.or.kr/openapi-data2/wisenut/search_api/search_json2.jsp
  # 발급받은 KMDB ServiceKey는 커밋하지 말고 환경변수로 주입하세요.
  # Windows PowerShell: $env:KMDB_SERVICE_KEY = "발급받은키"
  service-key: ${KMDB_SERVICE_KEY:}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
