server:
  port: 8080

spring:
  application:
    name: backend
  profiles:
    # 명시적으로 다른 프로필을 지정하지 않으면 local 프로필을 기본으로 사용합니다.
    # application-local.yml에 KMDB 키를 적어두면 매번 환경변수를 설정할 필요가 없습니다.
    default: local
  # db/docker-compose.yml로 띄운 로컬 MySQL 계정과 맞춰져 있습니다(db/README 성격의 docker-compose.yml 주석 참고).
  datasource:
    url: jdbc:mysql://localhost:3306/moviepick?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:moviepick}
    password: ${DB_PASSWORD:moviepick1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 db/schema.sql로 만듭니다. 엔티티가 그 스키마와 어긋나면 기동 시 바로 실패하도록 validate로 둡니다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

kmdb:
  base-url: https://api.koreafilm.or.kr/openapi-data2/wisenut/search_api/search_json2.jsp
  # 발급받은 KMDB ServiceKey는 커밋하지 말고 환경변수로 주입하세요.
  # Windows PowerShell: $env:KMDB_SERVICE_KEY = "발급받은키"
  service-key: ${KMDB_SERVICE_KEY:}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
