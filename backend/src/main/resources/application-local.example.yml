# 로컬 개발 전용 설정 템플릿입니다. 이 파일을 application-local.yml로 복사한 뒤
# 아래 값들을 실제 발급받은 키로 채워주세요. application-local.yml은 .gitignore에
# 등록되어 있어 커밋되지 않습니다.
# 아래 service-key 값에 KMDB에서 발급받은 ServiceKey를 그대로 붙여넣으세요.
kmdb:
  service-key: YOUR_KMDB_SERVICE_KEY

# AI 추천 채팅에 쓸 Gemini API 키. https://aistudio.google.com/apikey 에서 무료로 발급받아 붙여넣으세요.
gemini:
  api-key: YOUR_GEMINI_API_KEY
