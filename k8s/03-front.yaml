apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: moviepick-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moviepick-frontend
  template:
    metadata:
      labels:
        app: moviepick-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: frontend
          image: sungmin9842/moviepick-frontend:1.0
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: front-configmap
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: moviepick-frontend
spec:
  type: NodePort
  selector:
    app: moviepick-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30100
