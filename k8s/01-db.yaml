# Headless Service (StatefulSet용). backend는 db:3306 으로 접속합니다.
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: moviepick-db
spec:
  clusterIP: None
  selector:
    app: moviepick-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: moviepick-db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: moviepick-db
  template:
    metadata:
      labels:
        app: moviepick-db
    spec:
      # Docker Hub private 이미지인 경우: kubectl create secret docker-registry dockerhub-secret ...
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: db
          image: sungmin9842/moviepick-db:1.0
          ports:
            - name: mysql
              containerPort: 3306
          envFrom:
            - configMapRef:
                name: db-configmap
            - secretRef:
                name: db-secret
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
              subPath: mysql
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName 생략 = 클러스터의 default StorageClass 사용
        resources:
          requests:
            storage: 5Gi
